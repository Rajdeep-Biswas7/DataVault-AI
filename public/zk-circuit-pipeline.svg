      <rect y="104" width="248" height="6" rx="3" fill="#27272a" />
      <rect y="104" width="248" height="6" rx="3" fill="#FFD400" />
    </g>
    <text x="16" y="185" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">
