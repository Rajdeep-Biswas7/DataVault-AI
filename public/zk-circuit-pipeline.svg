    </text>
  </g>

  <!-- Step 3: Public Settlement -->
  <g transform="translate(680, 96)">
    <rect width="280" height="200" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="16" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
