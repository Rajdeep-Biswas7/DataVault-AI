  <!-- Step 2: Compact Prover -->
  <g transform="translate(360, 96)">
    <rect width="280" height="200" rx="12" fill="#18181b" stroke="#FFD400" stroke-width="1.5" />
    <text x="16" y="28" fill="#FFD400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
