<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circuitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
  </defs>

  <rect width="1000" height="340" rx="16" fill="url(#circuitBg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Header -->
