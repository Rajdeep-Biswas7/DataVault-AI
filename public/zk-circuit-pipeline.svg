    </text>
    
    <g transform="translate(16, 46)">
      <circle cx="124" cy="40" r="28" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <polygon points="124,24 138,32 138,48 124,56 110,48 110,32" stroke="#FFD400" stroke-width="1.5" fill="none" />
      <circle cx="124" cy="40" r="3" fill="#FFD400" />

      <text x="74" y="90" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
