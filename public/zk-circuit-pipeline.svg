      <text x="12" y="20" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">Enclave Spend Key:</text>
      <text x="140" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">●●●●●●●● (ZK)</text>

      <rect y="40" width="248" height="32" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="60" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">Record Count:</text>
      <text x="140" y="60" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">100,000 Private</text>

      <rect y="80" width="248" height="32" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="100" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">Blinding Nonce:</text>
      <text x="140" y="100" fill="#FFD400" font-family="'JetBrains Mono', monospace" font-size="10">r_seed_0x9f4a</text>
    </g>
    <text x="16" y="185" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="9">
