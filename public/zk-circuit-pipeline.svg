      <text x="12" y="20" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">ZK Commitment:</text>
      <text x="120" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">0x81686...05c9</text>

      <rect y="40" width="248" height="32" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="60" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">Ledger Counter:</text>
      <text x="120" y="60" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">computations += 1</text>

      <rect y="80" width="248" height="32" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="100" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">Policy Check:</text>
      <text x="120" y="100" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">100% SATISFIED</text>
