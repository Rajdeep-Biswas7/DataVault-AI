<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#121215" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Yellow Glow -->
    <radialGradient id="yellowGlow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFD400" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="bannerGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M.5 36V.5H36" fill="none" stroke="#27272a" stroke-width="0.8" stroke-dasharray="2 4" />
      <circle cx="0.5" cy="0.5" r="1" fill="#71717a" opacity="0.4" />
    </pattern>

    <!-- Gold Button Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#E5BE00" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#bannerGrid)" opacity="0.85" />
  <rect width="1200" height="480" fill="url(#yellowGlow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="478" rx="0" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Top Pill / Status -->
  <g transform="translate(60, 48)">
    <rect width="360" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="30" y="18" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      MIDNIGHT PREPROD • 1AM WALLET NATIVE
    </text>
  </g>

  <!-- Brand / Title -->
  <g transform="translate(60, 120)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#000000" stroke="#FFD400" stroke-width="1.5" />
    <polygon points="24,10 38,18 38,34 24,42 10,34 10,18" stroke="#FFD400" stroke-width="2" fill="none" />
    <circle cx="24" cy="26" r="4" fill="#FFD400" />

    <!-- Brand Name -->
    <text x="64" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5">
      DATAVAULT
    </text>
    <rect x="272" y="10" width="38" height="26" rx="6" fill="#FFD400" />
    <text x="281" y="28" fill="#000000" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="900">
      AI
    </text>

    <!-- Subheadline -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Confidential AI Clean Rooms for Sensitive Data
    </text>
    <text x="0" y="112" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Train and evaluate AI models over protected organizational data with zero exposure.
    </text>
    <text x="0" y="134" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Built natively on Midnight Network with Compact ZK smart contracts.
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 164)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="18" fill="#FFD400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COMPACT 0.34.0</text>

      <!-- Badge 2 -->
      <rect x="140" y="0" width="145" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="154" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1AM WALLET DAPP</text>

      <!-- Badge 3 -->
      <rect x="295" y="0" width="130" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="309" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">BLS12-381 ZK</text>
    </g>

    <!-- Call to action button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="180" height="44" rx="8" fill="url(#goldGrad)" />
      <text x="24" y="27" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">
        Launch Clean Room ➔
      </text>

      <rect x="194" y="0" width="150" height="44" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="214" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        1AM Explorer ↗
      </text>
    </g>
  </g>

  <!-- Right Visual Mockup Card (Cyphra style card) -->
  <g transform="translate(680, 70)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="460" height="340" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <rect width="460" height="6" rx="3" fill="#FFD400" />

    <!-- Card Header -->
    <g transform="translate(24, 24)">
      <rect width="32" height="32" rx="8" fill="#000000" stroke="#FFD400" stroke-width="1" />
      <path d="M16 9 L23 13 L23 20 C23 23 16 26 16 26 C16 26 9 23 9 20 L9 13 Z" fill="#FFD400" opacity="0.8" />
      
      <text x="42" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        Confidential Clean Room
      </text>
      <text x="42" y="28" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">
        Midnight PREPROD Circuit
      </text>

      <rect x="310" y="4" width="95" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
      <circle cx="320" cy="15" r="3" fill="#34d399" />
      <text x="328" y="19" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
        ZK-ENCRYPTED
      </text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="72" x2="436" y2="72" stroke="#27272a" stroke-width="1" />

    <!-- Card Body Fields -->
    <g transform="translate(24, 88)">
      <text x="0" y="12" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
        TARGET INSTITUTIONAL VAULT
      </text>
      <rect x="0" y="20" width="412" height="36" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="43" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="11">
        Hospital-Alpha Clinical Cohort (100k records)
      </text>
      <circle cx="394" cy="38" r="4" fill="#10b981" />

      <text x="0" y="80" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
        SELECTED MACHINE LEARNING MODEL
      </text>
      <rect x="0" y="88" width="412" height="36" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="111" fill="#FFD400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
        DiseaseRisk-RandomForest-v1 (Approved)
      </text>

      <rect x="0" y="136" width="412" height="32" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="156" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">
        Ledger Visibility:
      </text>
      <text x="120" y="156" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
        Private Witness (Zero-Leak)
      </text>

      <!-- Action Button in Card -->
      <rect x="0" y="180" width="412" height="38" rx="8" fill="url(#goldGrad)" />
      <text x="125" y="204" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">
        Execute Confidential Inference ➔
      </text>
    </g>
  </g>
</svg>
