    </pattern>
  </defs>

  <rect width="1000" height="420" rx="16" fill="url(#flowBg)" stroke="#27272a" stroke-width="1.5" />
  <rect width="1000" height="420" rx="16" fill="url(#flowGrid)" opacity="0.7" />

  <!-- Header -->
  <text x="40" y="44" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">
