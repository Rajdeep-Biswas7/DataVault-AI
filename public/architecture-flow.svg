      <rect y="100" width="220" height="34" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="0.8" />
      <text x="12" y="122" fill="#FFD400" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
