services:
  # Midnight Zero-Knowledge Proof Server (required for Preprod proofs)
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: datavault-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    restart: unless-stopped

  # DataVault AI Web dApp (Connected to Preprod Contract mn_addr_preprod1w7hatkynrx7yzleqse06cvz4dcctsw66xm3387h4vsxkqz5dmq2q7sx7ne)
  dapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datavault-dapp
    ports:
      - "8080:80"
    depends_on:
      - proof-server
    restart: unless-stopped
